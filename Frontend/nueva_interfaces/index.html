function times(ini,fin){const r=[];let [a,b]=ini.split(':').map(Number),[c,d]=fin.split(':').map(Number);let t=a*60+b;while(t+30<=c*60+d){r.push(String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0'));t+=30}return r}
function blq(med,f){return BLOQ.find(b=>f>=b.desde&&f<=b.hasta&&(b.tipo=='General'||b.med==med))}
function slots(med,f){const H=HOR[med],m=MED.find(x=>x.id==med);if(!H||!m||!m.activo)return[];const dw=new Date(f+'T12:00').getDay();if(!H.dias.includes(dw))return[];const b=blq(med,f);
 return times(H.ini,H.fin).map(t=>{const c=CITAS.find(c=>c.med==med&&c.fecha==f&&c.hora==t&&c.estado!='Cancelada');return{t,s:b?'hol':c?'busy':(f<TODAY?'past':'free'),c,b}})}

function recH(inModal){const s=REC.step;let b='';
 if(s==1)b=`<p class="lead">Ingrese su CI o correo registrado. Si existe, se enviará un código temporal.</p><div class="form">${F('r1','CI o correo',{full:1,req:1,val:inModal?V('u'):''})}</div><div class="actions">${inModal?'<button class="btn" onclick="closeM()">Volver</button>':''}<button class="btn pri" onclick="rec1(${inModal})">Enviar código</button></div>`;
 if(s==2)b=`<p class="lead">Si los datos coinciden con una cuenta, recibirá un código de 6 dígitos. <span class="mono">(Demo: ${REC.code||'—'})</span></p><div class="form">${F('r2','Código de verificación',{req:1,a:'inputmode="numeric" maxlength="6"'})}${F('r3','Nueva contraseña',{type:'password',req:1})}${F('r4','Repetir contraseña',{type:'password',req:1})}</div><p class="hint">Mínimo 8 caracteres, al menos un número.</p><div class="actions"><button class="btn" onclick="REC.step=1;recR(${inModal})">Atrás</button><button class="btn pri" onclick="rec2(${inModal})">Restablecer</button></div>`;
 if(s==3)b=`<p class="lead">Contraseña actualizada. Ya puede iniciar sesión con la nueva clave.</p><div class="actions"><button class="btn pri" onclick="REC={step:1};${inModal?'closeM()':'re()'}">Listo</button></div>`;
 return `<ol class="steps">${['Identificarse','Verificar código','Listo'].map((t,i)=>`<li class="${i+1==s?'on':i+1<s?'ok':''}">${t}</li>`).join('')}</ol>${b}`}
function recR(m){if(m)$('#modal').innerHTML='<h3 id="mt">Recuperar contraseña</h3>'+recH(1);else re()}
function rec1(m){clr();const v=V('r1');if(!E('r1',v?'':'Campo obligatorio.'))return;const u=USERS.find(x=>x.ci==v||x.correo.toLowerCase()==v.toLowerCase());REC={step:2,u,code:u?String(100000+Math.random()*899999|0):''};if(u){const _m=ME;ME=ME||u;log('Solicitud de recuperación de contraseña','Seguridad');ME=_m}recR(m)}
function rec2(m){clr();const c=V('r2'),p=V('r3');let ok=true;
 if(!REC.u||c!==REC.code)ok=E('r2','Código inválido o expirado.')&&ok;if(p.length<8||!/\d/.test(p))ok=E('r3','Mínimo 8 caracteres y un número.')&&ok;if(p!==V('r4'))ok=E('r4','Las contraseñas no coinciden.')&&ok;if(!ok)return;
 REC.u.pass=p;REC.u.lock=0;REC.u.fails=0;const _m=ME;ME=ME||REC.u;log('Restablecimiento de contraseña','Seguridad');ME=_m;REC.step=3;recR(m)}

 modal(`<h3 id="mt">Desactivar médico</h3><p class="lead">${h(m.nombre)} no generará nuevos bloques de agenda. El historial se conserva.</p><div class="actions"><button class="btn" onclick="closeM()">Volver</button><button class="btn danger" onclick="doOffM(${id})">Desactivar</button></div>`)}
function reasg(id){const to=+V('ra');let n=0;pend(c=>c.med==id).forEach(c=>{if(CITAS.some(x=>x.med==to&&x.fecha==c.fecha&&x.hora==c.hora&&x.estado!='Cancelada')){c.estado='Cancelada'}else{c.med=to;n++}log(`Reasignó ${c.cod} a ${mN(to)}`,'Citas')});doOffM(id)}
function doOffM(id){const m=MED.find(x=>x.id==id);m.activo=0;const u=USERS.find(x=>x.correo==m.correo);if(u)u.estado='Inactivo';log('Baja lógica médico '+m.nombre,'Médicos');closeM();toast('Médico desactivado');re()}

S['22']=()=>hd('Bloquear agenda','Feriado (general, toda la clínica) o licencia (individual). Las fechas bloqueadas no admiten nuevas citas.')+sec('Nuevo bloqueo',`<div class="form">${F('bt','Tipo de bloqueo',{type:'select',opts:[['General','General (Feriado)'],['Individual','Individual (Licencia)']],val:'Individual'}).replace('<select','<select onchange="$(\'#bmw\').hidden=this.value==\'General\'"')}<div id="bmw">${mSel('bmd',2)}</div>${F('bd1','Fecha inicio',{type:'date',req:1,val:addD(3),a:`min="${TODAY}"`})}${F('bd2','Fecha fin',{type:'date',req:1,val:addD(3),a:`min="${TODAY}"`})}${F('bmo','Motivo',{full:1,req:1,a:'placeholder="p. ej. Feriado nacional, Licencia médica"'})}</div><div class="actions left"><button class="btn pri" onclick="aplB()">Aplicar bloqueo de agenda</button></div>`)+

function aplB(){clr();let ok=true;const t=V('bt'),a=V('bd1'),b=V('bd2'),m=+V('bmd');if(!a||a<TODAY)ok=E('bd1','Fecha inválida o pasada.')&&ok;if(!b||b<a)ok=E('bd2','La fecha fin debe ser igual o posterior a la de inicio.')&&ok;if(!V('bmo'))ok=E('bmo','Indique el motivo.')&&ok;if(!ok)return;
 const f=c=>c.fecha>=a&&c.fecha<=b&&(t=='General'||c.med==m),r=pend(f),nb={id:Date.now(),tipo:t,med:t=='General'?null:m,desde:a,hasta:b,motivo:V('bmo')};
 if(r.length)return modal(`<h3 id="mt">Citas afectadas</h3><p class="lead">Hay ${r.length} cita(s) en el rango. Debe cancelarlas con justificación (o reprogramarlas, CU26 · Ciclo 2):</p>${pendL(r)}<div class="form">${F('mot','Justificación',{full:1,req:1,val:nb.motivo})}</div><div class="actions"><button class="btn" onclick="closeM()">Volver</button><button class="btn danger" id="cab">Cancelar citas y bloquear</button></div>`),$('#cab').onclick=()=>cancelAll(f,()=>doB(nb));

function doB(nb){BLOQ.push(nb);log(`Bloqueó agenda (${nb.tipo}) ${fmt(nb.desde)}–${fmt(nb.hasta)}: ${nb.motivo}`,'Médicos');closeM();toast('Bloqueo aplicado');re()}

/* CU24 programar (Ciclo 2, funcional) */
let BK={ci:'',f:TODAY,esp:'',sel:null,mm:1};
book=function(){const ms=MED.filter(m=>m.activo&&(!BK.esp||m.esp==BK.esp));if(!ms.some(m=>m.id==BK.mm))BK.mm=ms[0]?.id;const all=ms.map(m=>({m,sl:slots(m.id,BK.f)}));const T=[...new Set(all.flatMap(x=>x.sl.map(s=>s.t)))].sort();
 const cell=(m,s)=>{if(!s)return`<span class="slot na" aria-hidden="true"></span>`;const on=BK.sel&&BK.sel.med==m.id&&BK.sel.t==s.t;const lb={free:'Libre',busy:s.c?pN(s.c.ci).split(' ')[0]+' '+(pN(s.c.ci).split(' ')[1]||'')[0]+'.':'Ocupado',hol:s.b?.tipo=='General'?'Feriado':'Licencia',past:'Pasado'}[s.s];
  return s.s=='free'?`<button class="slot free ${on?'sel':''}" aria-pressed="${on}" aria-label="${m.nombre} ${s.t} libre" onclick="pickB(${m.id},'${s.t}')">${on?'Seleccionado':'Libre'}</button>`:`<button class="slot ${s.s=='past'?'busy':s.s}" disabled aria-label="${m.nombre} ${s.t} ${lb}">${h(lb)}</button>`};
 const mob=(all.find(x=>x.m.id==BK.mm)||{sl:[]}).sl;
 return hd('Programar cita','Seleccione paciente y un bloque libre de 30 minutos. El sistema impide asignar dos pacientes al mismo médico en el mismo bloque (CU25).')+
 `<div class="filters">${pSel('bci',BK.ci).replace('<select','<select onchange="BK.ci=this.value"')}${F('bfe','Fecha',{type:'date',val:BK.f,a:`min="${TODAY}"`}).replace('<input','<input onchange="if(this.value<TODAY){this.value=BK.f;toast(\'No se pueden elegir fechas pasadas\');return}BK.f=this.value;BK.sel=null;re()"')}${F('bes','Especialidad',{type:'select',val:BK.esp,opts:[['','Todas'],...ESP.filter(e=>e.activo).map(e=>[e.id,e.nombre])]}).replace('<select','<select onchange="BK.esp=this.value;BK.sel=null;re()"')}</div>
 <div class="book"><div><div class="desk">${T.length?`<div class="slots" style="grid-template-columns:70px repeat(${all.length},minmax(0,1fr))"><div class="h"></div>${all.map(x=>`<div class="h">${h(x.m.nombre)}<br><span style="color:var(--mute);font-weight:400">${eN(x.m.esp)}</span></div>`).join('')}${T.map(t=>`<div class="t mono">${t}</div>`+all.map(x=>cell(x.m,x.sl.find(s=>s.t==t))).join('')).join('')}</div>`:'<div class="emptybox"><p>Ningún médico atiende en la fecha seleccionada.</p></div>'}
 <div class="legend"><span><i></i>Libre</span><span><i style="background:#E6EBF3"></i>Ocupado</span><span><i style="background:#F3E2B8"></i>Feriado / licencia</span></div></div>
 <div class="mobi">${F('bmm','Médico',{type:'select',val:BK.mm,opts:ms.map(m=>[m.id,m.nombre+' · '+eN(m.esp)])}).replace('<select','<select onchange="BK.mm=+this.value;BK.sel=null;re()"')}<div class="slotlist">${mob.length?mob.map(s=>{const on=BK.sel&&BK.sel.med==BK.mm&&BK.sel.t==s.t;return`<button class="sbtn ${s.s} ${on?'sel':''}" ${s.s=='free'?`onclick="pickB(${BK.mm},'${s.t}')"`:'disabled'} aria-pressed="${on}"><span class="mono">${s.t}</span><span>${s.s=='free'?(on?'Seleccionado':'Libre'):s.s=='hol'?'Bloqueado':s.s=='past'?'Pasado':'Ocupado'}</span></button>`}).join(''):'<p class="hint">El médico no atiende este día.</p>'}</div></div></div>
 <div class="sum" aria-live="polite" id="sum">${sumB()}</div></div>`};
function sumB(){if(!BK.sel)return`<h2>Resumen</h2><p style="color:var(--mute)">Ningún bloque seleccionado.</p>`;const m=MED.find(x=>x.id==BK.sel.med);
 return`<h2>Resumen</h2><div class="mono" style="font-size:1.5rem">CM-0${SEQ}</div><dl class="kv"><dt>Paciente</dt><dd>${BK.ci?h(pN(BK.ci)):'<span class="rq">Sin seleccionar</span>'}</dd><dt>Médico</dt><dd>${h(m.nombre)}</dd><dt>Especialidad</dt><dd>${eN(m.esp)}</dd><dt>Fecha</dt><dd class="mono">${fmt(BK.f)}</dd><dt>Hora</dt><dd class="mono">${BK.sel.t}</dd><dt>Estado</dt><dd>${st('Programada')}</dd></dl>${F('bmot','Motivo de consulta',{full:1})}<div class="err" id="berr" aria-live="assertive"></div><button class="btn pri full" onclick="confB()">Confirmar cita</button>`}
function pickB(m,t){BK.sel={med:m,t};BK.mm=m;document.querySelectorAll('.slot.sel,.sbtn.sel').forEach(s=>{s.classList.remove('sel');s.setAttribute('aria-pressed',false);s.lastChild.textContent?.length;});document.querySelectorAll(`[onclick="pickB(${m},'${t}')"]`).forEach(b=>{b.classList.add('sel');b.setAttribute('aria-pressed',true)});$('#sum').innerHTML=sumB();if(mob())$('#sum').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}
function confB(){const ci=V('bci')||BK.ci,s=BK.sel;if(!ci){$('#berr').textContent='Seleccione un paciente.';return}
 if(CITAS.some(c=>c.med==s.med&&c.fecha==BK.f&&c.hora==s.t&&c.estado!='Cancelada')){$('#berr').textContent='El bloque acaba de ser ocupado (control de concurrencia). Elija otro.';return}
 if(CITAS.some(c=>c.ci==ci&&c.fecha==BK.f&&c.hora==s.t&&c.estado!='Cancelada')){$('#berr').textContent='El paciente ya tiene una cita en ese horario.';return}
 const c={cod:'CM-0'+SEQ++,ci,med:s.med,fecha:BK.f,hora:s.t,estado:'Programada',motivo:V('bmot')||'Consulta'};CITAS.push(c);log(`Programó cita ${c.cod} · ${pN(ci)} · ${mN(s.med)} ${fmt(c.fecha)} ${c.hora}`,'Citas');toast(`Cita ${c.cod} programada`);BK.sel=null;re()}

 `<div class="counts"><div><b>${c('Programada')}</b><span>Programadas</span></div><div><b>${c('Confirmada')}</b><span>Confirmadas</span></div><div><b>${c('Atendida')}</b><span>Atendidas</span></div><div><b>${c('Inasistencia')}</b><span>Inasistencias</span></div></div>`+
 tbl(['Hora','Código','Paciente','Motivo','Estado',''],r.map((a,i)=>[`<span class="mono">${a.hora}</span>`,`<span class="mono">${a.cod}</span>`,h(pN(a.ci)),h(a.motivo),st(a.estado),(a.estado=='Programada'?`<button class="btn" onclick="setE('${a.cod}','Confirmada')">Confirmar</button> `:'')+(a.estado=='Programada'||a.estado=='Confirmada'?`<button class="btn pri" onclick="setE('${a.cod}','Atendida')">Marcar atendida</button> <button class="btn" onclick="setE('${a.cod}','Inasistencia')">Inasistencia</button> <button class="btn ghost" onclick="cancelA('${a.cod}')">Cancelar</button>`:'')]),'No hay citas para este médico en la fecha.')};

Object.keys(S).forEach(k=>SCREEN[k]=S[k]);['24','25'].forEach(k=>SCREEN[k]=book);['29','30','31'].forEach(k=>SCREEN[k]=agenda);

const dm2=location.hash.match(/^#demo-?(\d\d)?/);if(dm2){if(dm2[1])cur=dm2[1];$('#p').value='vida2026';$('#lf').requestSubmit();if(/[&]d/.test(location.hash))hamb(true)}
